[package]
name = "soundcraft-playback"
description = "SoundCraft audio device I/O: realtime playback and recording through the mix engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["plugin-hosts"]
plugin-hosts = ["soundcraft-mix/plugin-hosts"]
# ASIO downloads Steinberg's SDK and requires LLVM/libclang for bindings.
asio = ["cpal/asio"]

[dependencies]
soundcraft-time.workspace = true
soundcraft-audio-io.workspace = true
soundcraft-model.workspace = true
soundcraft-mix = { path = "../mix", default-features = false }
soundcraft-dsp.workspace = true
log.workspace = true
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { workspace = true, features = ["wasm-bindgen"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
